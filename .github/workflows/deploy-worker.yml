name: Deploy Capture Worker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "src/capture-contract.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:
    inputs:
      target:
        description: Deployment environment
        required: true
        default: staging
        type: choice
        options: [staging, production]

permissions:
  contents: read

jobs:
  staging:
    if: vars.CAPTURE_WORKER_PROVISIONED == 'true' && (github.event_name == 'push' || inputs.target == 'staging')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency: capture-worker-staging
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate environment credentials
        env:
          CAPTURE_BEARER_TOKEN: ${{ secrets.CAPTURE_BEARER_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test "${#CAPTURE_BEARER_TOKEN}" -ge 32
      - run: npx wrangler d1 migrations apply dmc-captures-staging --config worker/wrangler.jsonc --env staging --remote
      - name: Deploy staging Worker with its retrieval secret
        env:
          CAPTURE_BEARER_TOKEN: ${{ secrets.CAPTURE_BEARER_TOKEN }}
        run: |
          secrets_file="$RUNNER_TEMP/dmc-worker-secrets.json"
          umask 077
          jq -n --arg token "$CAPTURE_BEARER_TOKEN" \
            '{CAPTURE_BEARER_TOKEN: $token}' > "$secrets_file"
          npx wrangler deploy --config worker/wrangler.jsonc --env staging \
            --secrets-file "$secrets_file"
      - run: npm run worker:lifecycle:staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

  production:
    if: vars.CAPTURE_WORKER_PROVISIONED == 'true' && github.event_name == 'workflow_dispatch' && inputs.target == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency: capture-worker-production
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate environment credentials
        env:
          CAPTURE_BEARER_TOKEN: ${{ secrets.CAPTURE_BEARER_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test "${#CAPTURE_BEARER_TOKEN}" -ge 32
      - run: npx wrangler d1 migrations apply dmc-captures --config worker/wrangler.jsonc --env production --remote
      - name: Deploy production Worker with its retrieval secret
        env:
          CAPTURE_BEARER_TOKEN: ${{ secrets.CAPTURE_BEARER_TOKEN }}
        run: |
          secrets_file="$RUNNER_TEMP/dmc-worker-secrets.json"
          umask 077
          jq -n --arg token "$CAPTURE_BEARER_TOKEN" \
            '{CAPTURE_BEARER_TOKEN: $token}' > "$secrets_file"
          npx wrangler deploy --config worker/wrangler.jsonc --env production \
            --secrets-file "$secrets_file"
      - run: npm run worker:lifecycle:production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
