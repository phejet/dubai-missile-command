name: Deploy Capture Worker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "src/capture-contract.ts"
      - "src/capture-auth-protocol.ts"
      - "scripts/verify-r2-lifecycle.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:
    inputs:
      target:
        description: Deployment environment
        required: true
        default: staging
        type: choice
        options: [staging, production]

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:worker
      - run: npx wrangler deploy --config worker/wrangler.jsonc --env staging --dry-run --outdir /tmp/dmc-worker-staging
      - run: npx wrangler deploy --config worker/wrangler.jsonc --env production --dry-run --outdir /tmp/dmc-worker-production

  staging:
    if: vars.CAPTURE_STAGING_PROVISIONED == 'true' && (github.event_name == 'push' || inputs.target == 'staging')
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency: capture-worker-staging
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate environment credentials
        env:
          CAPTURE_BEARER_TOKEN: ${{ secrets.CAPTURE_BEARER_TOKEN }}
          CAPTURE_AUTH_SECRET: ${{ secrets.CAPTURE_AUTH_SECRET }}
          ALLOWED_BUILDS: ${{ vars.ALLOWED_BUILDS }}
          APPLE_BUNDLE_IDS: ${{ vars.APPLE_BUNDLE_IDS }}
          APPLE_BUNDLE_VERSIONS: ${{ vars.APPLE_BUNDLE_VERSIONS }}
          APPLE_VALIDATION_CATEGORIES: ${{ vars.APPLE_VALIDATION_CATEGORIES }}
          ENROLLMENT_ENABLED: ${{ vars.ENROLLMENT_ENABLED }}
          APPLE_ATTEST_ENVIRONMENTS: ${{ vars.APPLE_ATTEST_ENVIRONMENTS }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test "${#CAPTURE_BEARER_TOKEN}" -ge 32
          test "${#CAPTURE_AUTH_SECRET}" -ge 32
          test -n "$ALLOWED_BUILDS"
          test -n "$APPLE_BUNDLE_IDS"
          test -n "$APPLE_BUNDLE_VERSIONS"
          test -n "$APPLE_VALIDATION_CATEGORIES"
          test "$ENROLLMENT_ENABLED" = true -o "$ENROLLMENT_ENABLED" = false
          test -n "$APPLE_ATTEST_ENVIRONMENTS"
      - run: npx wrangler d1 migrations apply dmc-captures-staging --config worker/wrangler.jsonc --env staging --remote
      - name: Deploy staging Worker with its retrieval secret
        env:
          CAPTURE_BEARER_TOKEN: ${{ secrets.CAPTURE_BEARER_TOKEN }}
          CAPTURE_AUTH_SECRET: ${{ secrets.CAPTURE_AUTH_SECRET }}
          ALLOWED_BUILDS: ${{ vars.ALLOWED_BUILDS }}
          APPLE_BUNDLE_IDS: ${{ vars.APPLE_BUNDLE_IDS }}
          APPLE_BUNDLE_VERSIONS: ${{ vars.APPLE_BUNDLE_VERSIONS }}
          APPLE_VALIDATION_CATEGORIES: ${{ vars.APPLE_VALIDATION_CATEGORIES }}
          ENROLLMENT_ENABLED: ${{ vars.ENROLLMENT_ENABLED }}
          APPLE_ATTEST_ENVIRONMENTS: ${{ vars.APPLE_ATTEST_ENVIRONMENTS }}
        run: |
          secrets_file="$RUNNER_TEMP/dmc-worker-secrets.json"
          umask 077
          jq -n --arg token "$CAPTURE_BEARER_TOKEN" --arg auth "$CAPTURE_AUTH_SECRET" \
            '{CAPTURE_BEARER_TOKEN: $token, CAPTURE_AUTH_SECRET: $auth}' > "$secrets_file"
          npx wrangler deploy --config worker/wrangler.jsonc --env staging \
            --var "WORKER_BUILD:staging" \
            --var "ALLOWED_BUILDS:$ALLOWED_BUILDS" \
            --var "APPLE_TEAM_ID:5A2PL567F2" \
            --var "APPLE_BUNDLE_IDS:$APPLE_BUNDLE_IDS" \
            --var "APPLE_BUNDLE_VERSIONS:$APPLE_BUNDLE_VERSIONS" \
            --var "APPLE_VALIDATION_CATEGORIES:$APPLE_VALIDATION_CATEGORIES" \
            --var "APPLE_ATTEST_ENVIRONMENTS:$APPLE_ATTEST_ENVIRONMENTS" \
            --var "ENROLLMENT_ENABLED:$ENROLLMENT_ENABLED" \
            --var "PUBLIC_GAME_URL:https://phejet.github.io/dubai-missile-command/" \
            --secrets-file "$secrets_file"
      - name: Apply and verify staging R2 lifecycle
        run: |
          npm run worker:lifecycle:staging
          npm run worker:lifecycle:verify:staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

  production:
    if: vars.CAPTURE_PRODUCTION_PROVISIONED == 'true' && github.event_name == 'workflow_dispatch' && inputs.target == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency: capture-worker-production
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate environment credentials
        env:
          CAPTURE_BEARER_TOKEN: ${{ secrets.CAPTURE_BEARER_TOKEN }}
          CAPTURE_AUTH_SECRET: ${{ secrets.CAPTURE_AUTH_SECRET }}
          ALLOWED_BUILDS: ${{ vars.ALLOWED_BUILDS }}
          APPLE_BUNDLE_IDS: ${{ vars.APPLE_BUNDLE_IDS }}
          APPLE_BUNDLE_VERSIONS: ${{ vars.APPLE_BUNDLE_VERSIONS }}
          APPLE_VALIDATION_CATEGORIES: ${{ vars.APPLE_VALIDATION_CATEGORIES }}
          ENROLLMENT_ENABLED: ${{ vars.ENROLLMENT_ENABLED }}
          APPLE_ATTEST_ENVIRONMENTS: ${{ vars.APPLE_ATTEST_ENVIRONMENTS }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test "${#CAPTURE_BEARER_TOKEN}" -ge 32
          test "${#CAPTURE_AUTH_SECRET}" -ge 32
          test -n "$ALLOWED_BUILDS"
          test -n "$APPLE_BUNDLE_IDS"
          test -n "$APPLE_BUNDLE_VERSIONS"
          test -n "$APPLE_VALIDATION_CATEGORIES"
          test "$ENROLLMENT_ENABLED" = true -o "$ENROLLMENT_ENABLED" = false
          test "$APPLE_ATTEST_ENVIRONMENTS" = production
      - run: npx wrangler d1 migrations apply dmc-captures --config worker/wrangler.jsonc --env production --remote
      - name: Deploy production Worker with its retrieval secret
        env:
          CAPTURE_BEARER_TOKEN: ${{ secrets.CAPTURE_BEARER_TOKEN }}
          CAPTURE_AUTH_SECRET: ${{ secrets.CAPTURE_AUTH_SECRET }}
          ALLOWED_BUILDS: ${{ vars.ALLOWED_BUILDS }}
          APPLE_BUNDLE_IDS: ${{ vars.APPLE_BUNDLE_IDS }}
          APPLE_BUNDLE_VERSIONS: ${{ vars.APPLE_BUNDLE_VERSIONS }}
          APPLE_VALIDATION_CATEGORIES: ${{ vars.APPLE_VALIDATION_CATEGORIES }}
          ENROLLMENT_ENABLED: ${{ vars.ENROLLMENT_ENABLED }}
        run: |
          secrets_file="$RUNNER_TEMP/dmc-worker-secrets.json"
          umask 077
          jq -n --arg token "$CAPTURE_BEARER_TOKEN" --arg auth "$CAPTURE_AUTH_SECRET" \
            '{CAPTURE_BEARER_TOKEN: $token, CAPTURE_AUTH_SECRET: $auth}' > "$secrets_file"
          npx wrangler deploy --config worker/wrangler.jsonc --env production \
            --var "WORKER_BUILD:production" \
            --var "ALLOWED_BUILDS:$ALLOWED_BUILDS" \
            --var "APPLE_TEAM_ID:5A2PL567F2" \
            --var "APPLE_BUNDLE_IDS:$APPLE_BUNDLE_IDS" \
            --var "APPLE_BUNDLE_VERSIONS:$APPLE_BUNDLE_VERSIONS" \
            --var "APPLE_VALIDATION_CATEGORIES:$APPLE_VALIDATION_CATEGORIES" \
            --var "APPLE_ATTEST_ENVIRONMENTS:production" \
            --var "ENROLLMENT_ENABLED:$ENROLLMENT_ENABLED" \
            --var "PUBLIC_GAME_URL:https://phejet.github.io/dubai-missile-command/" \
            --secrets-file "$secrets_file"
      - name: Apply and verify production R2 lifecycle
        run: |
          npm run worker:lifecycle:production
          npm run worker:lifecycle:verify:production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    needs: preflight
