name: Deploy Capture Worker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "src/capture-contract.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:
    inputs:
      target:
        description: Deployment environment
        required: true
        default: staging
        type: choice
        options: [staging, production]

permissions:
  contents: read

jobs:
  staging:
    if: vars.CAPTURE_WORKER_PROVISIONED == 'true' && (github.event_name == 'push' || inputs.target == 'staging')
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx wrangler d1 migrations apply dmc-captures-staging --config worker/wrangler.jsonc --env staging --remote
      - run: npx wrangler deploy --config worker/wrangler.jsonc --env staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  production:
    if: vars.CAPTURE_WORKER_PROVISIONED == 'true' && github.event_name == 'workflow_dispatch' && inputs.target == 'production'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx wrangler d1 migrations apply dmc-captures --config worker/wrangler.jsonc --env production --remote
      - run: npx wrangler deploy --config worker/wrangler.jsonc --env production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
